<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pallet to Pewter Reference</title>
<!-- Generated by tools/build_reference.py from the game's own data: edit that and tools/reference_template.html, not the output. -->
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#1d1d24;--dim:#6b6b78;--line:#e4dfd4;--chip:#efeae0;--chip-on:#1d1d24;--chip-on-ink:#fff;
  --accent:#c8302c;--accent-ink:#fff;--hover:#faf8f3;--open:#fbf6ec;--good:#2c8a4b;--shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151a;--panel:#1d1e26;--ink:#ececf1;--dim:#9b9cab;--line:#2d2e3a;--chip:#272834;
  --chip-on:#ececf1;--chip-on-ink:#14151a;--accent:#ff5b4a;--accent-ink:#14151a;--hover:#22232c;--open:#23242e;--good:#5fd38a;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#14151a;--panel:#1d1e26;--ink:#ececf1;--dim:#9b9cab;--line:#2d2e3a;--chip:#272834;--chip-on:#ececf1;--chip-on-ink:#14151a;
  --accent:#ff5b4a;--accent-ink:#14151a;--hover:#22232c;--open:#23242e;--good:#5fd38a;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:16px}
header.top .ball{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(var(--accent-ink) 0 0) center/100% 3px no-repeat,
  radial-gradient(circle,var(--accent) 0 4px,var(--accent-ink) 4.5px 7px,transparent 7.5px),linear-gradient(transparent 50%,var(--accent-ink) 50%);
  border:3px solid var(--accent-ink);opacity:.95}
header.top h1{margin:0;font-size:22px;letter-spacing:.2px}
header.top p{margin:2px 0 0;font-size:13px;opacity:.85}
header.top .theme{margin-left:auto;background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:inherit}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--dim)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button b{font-weight:500;font-size:12px;margin-left:5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--dim)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 8px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.search input:focus,.tools select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tools select{padding:8px 28px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.tools select.set{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:2px 0 10px}
.status a{color:var(--accent);cursor:pointer;text-decoration:underline}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px}
.list>.row:first-child{border-radius:14px 14px 0 0}.list>.row:last-child{border-radius:0 0 14px 14px}
.row{display:grid;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}
.row.open{background:var(--open)}
.row.head{position:sticky;top:43px;z-index:4;border-top:0;cursor:default;background:var(--panel);font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.row.head:hover{background:var(--panel)}
.row.head button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-align:inherit;width:100%}
.row.head button.on{color:var(--ink)}
.row.head button.on::after{content:" ▲";font-size:10px}
.row.head button.on.desc::after{content:" ▼"}
.list .row.head + .row{border-top:0}
.mv{grid-template-columns:minmax(150px,1.3fr) 86px 84px 52px 52px 62px 118px minmax(0,2.2fr)}
.anim{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.anim i{font-style:normal;font-size:11px;color:var(--dim)}
.it{grid-template-columns:minmax(170px,1.3fr) 150px 74px minmax(0,2.6fr)}
.c{min-width:0}
.c.desc-c{padding-left:8px}
.c.anim-c{padding-left:12px}
.c.num{font-variant-numeric:tabular-nums;text-align:right}
.name{font-weight:650;display:flex;align-items:center;gap:8px;min-width:0}
.name img{width:24px;height:24px;flex:none;image-rendering:pixelated}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:#d89a00;font-size:12px}
.desc{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tyt{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;text-shadow:0 1px 0 rgba(0,0,0,.35);min-width:64px;text-align:center}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;min-width:64px;text-align:center}
.cat.P{background:#f3d9c9;color:#8a3a12}.cat.S{background:#d6e2f6;color:#23458a}.cat.X{background:var(--chip);color:var(--dim)}
:root[data-theme="dark"] .cat.P{background:#4a2c1e;color:#ffbe98}:root[data-theme="dark"] .cat.S{background:#1f2e4a;color:#a9c4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat.P{background:#4a2c1e;color:#ffbe98}:root:not([data-theme="light"]) .cat.S{background:#1f2e4a;color:#a9c4ff}}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--dim);margin:0 4px 4px 0}
.detail{grid-column:1/-1;cursor:default;padding:4px 2px 8px;display:grid;gap:10px;font-size:13.5px}
.detail .fx{margin:0;padding-left:18px}
.detail .fx li{margin:2px 0}
.detail h4{margin:4px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.detail .kv{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim)}
.detail .kv b{color:var(--ink);font-weight:600}
.mons{line-height:1.8}
.empty{padding:28px;text-align:center;color:var(--dim)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0;color:var(--ink);opacity:.9}
.gsec{margin:18px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
footer{color:var(--dim);font-size:12px;padding:10px 0 30px}
@media (max-width:820px){
  .mv{grid-template-columns:minmax(0,1fr) 78px 52px 56px}
  .mv .c.cat-c,.mv .c.acc,.mv .c.desc-c,.mv .c.anim-c{display:none}
  .it{grid-template-columns:minmax(0,1fr) 70px}
  .it .c.icat,.it .c.desc-c{display:none}
  .row.head{top:43px}
  .gl{grid-template-columns:1fr}
}
</style>
</head>

JaYDY+ZeMWk6GIyMfUurg+40esQuGrD2cnDlC2E6WPk20srvQ0k/DuQJJrgKCs5OxdsAAAAASUVORK5CYII=","key":false,"held":true,"sold":[],"found":["VIRIDIAN GYM Leader GIOVANNI (hidden)"],"tm":""}],"types":{"Flying":"#a890f0","Psychic":"#f85888","Normal":"#a8a878","Dark":"#705848","Water":"#6890f0","Fighting":"#c03028","Fire":"#f08030","Grass":"#78c850","Ground":"#e0c068","Steel":"#b8b8d0","Bug":"#a8b820","Poison":"#a040a0","Rock":"#b8a038","???":"#68a090","Electric":"#f8d030","Ghost":"#705898","Ice":"#98d8d8","Dragon":"#7038f8","Fairy":"#ee99ac"},"nSpecies":151,"built":"2026-10-24T18:53:35.626Z"},"x":{"sp":{"defensecurl":"Raises DEFENSE 1 stage and leaves the user curled up: for as long as it stays in, its ROLLOUT has double power.","focusenergy":"Gets the user pumped: +2 critical-hit stages for as long as it stays in (1/16 becomes 1/4, or 1/3 with a high-crit move). Its cooldown is 6 s.","growth":"Raises ATTACK and SP. ATK 1 stage each. No other effect.","leechseed":"Seeds the target (GRASS types are immune): every 3 s it loses 1/8 of its max HP and the seeder regains the same amount. It lasts until the seeded POKéMON leaves the field or uses RAPID SPIN; the cooldown is 8 s.","weight":"Power depends on the target's weight: 20 under 10 kg, 40 under 25 kg, 60 under 50 kg, 80 under 100 kg, 100 under 200 kg, 120 from 200 kg up.","magnitude":"Power is rolled on every use: 10 (5%), 30 (10%), 50 (20%), 70 (30%), 90 (20%), 110 (10%) or 150 (5%). It's a blast through the ground, so it misses a target that's in the air (a hovering bird, a POKéMON mid-hop), and it hits only the one foe the user is fighting.","mudsport":"For 12 s, ELECTRIC moves deal half damage on both sides.","protect":"For 1.4 s, every attack that reaches the user is blocked, even moves that never miss and signature moves. The cooldown is 6 s; its priority has no effect in real time.","pursuit":"Plays as a blink strike: the user vanishes and reappears beside the target, which makes it much harder to dodge (dodge chance ×0.45). It does no extra damage to a POKéMON being switched out.","ragefist":"Power climbs as the user's HP falls: 20 above about 69% HP, 40 above 35%, 80 above 21%, 100 above 10%, 150 above 4%, 200 below that (FLAIL, REVERSAL and RAGE). RAGE also builds rage: after using it, every damaging hit the user takes raises its ATTACK 1 stage for as long as it stays in.","rapidspin":"If it hits, the user breaks free of a BIND-style trap and shakes off LEECH SEED, and its SPEED rises 1 stage. It doesn't clear SPIKES.","ramp":"ROLLOUT doesn't build up over uses here: it simply has double power once the user has used DEFENSE CURL. FURY CUTTER doubles for every use in a row (40, then 80, then 160, the cap) and resets when the user starts any other move.","sandstorm":"Whips up a sandstorm for 15 s: every 3 s it hurts each POKéMON that isn't ROCK, GROUND or STEEL type by 1/16 of its max HP. Another weather move ends it.","seismictoss":"Deals damage equal to the user's level, staged as a grab, a spinning leap and a slam (GHOST types are immune). STAB, critical hits, screens and held items don't change it.","selfdestruct":"A 250-power blast after which the user faints, even if the target dodges, protects itself or takes no damage. It can catch a target in the air but hits only the one foe it is aimed at; the cooldown is about 11 s, and POKéMON rarely pick it until they are below 1/4 HP.","struggle":"A 50-power typeless attack: no STAB, and it hits every type at normal effectiveness, GHOSTS included. The user takes 1/4 of the damage dealt as recoil; a POKéMON struggles when none of its moves can affect any foe (cooldown 2.2 s).","superfang":"SUPER FANG takes half of the target's current HP (at least 1). The one-hit KO moves (FISSURE, HORN DRILL, GUILLOTINE, SHEER COLD) share this key: they knock the target out if the user's level is at least the target's, and otherwise do nothing.","whirlwind":"In this game a 60-power special NORMAL attack: a gust that never misses, can't be dodged and blows the target back across the arena. It doesn't force a switch.","aromatherapy":"Cures the user's own status problem only (not the rest of the team, and not confusion). With no status it just perfumes the air.","bellydrum":"The user cuts half of its max HP to max out its ATTACK (+6). It fails at half HP or less, or with ATTACK already maxed.","semi":"Two steps: the user flies up (FLY, BOUNCE, DIVE) or burrows (DIG) and stays hidden for 0.9 s, during which attacks on it have only 60% of their accuracy; then it strikes as an ambush with +1 critical-hit stage that can't be dodged. BOUNCE also has a 30% chance to paralyze.","brickbreak":"After the hit lands it shatters the target side's REFLECT and LIGHT SCREEN (the hit itself is still reduced by them).","camouflage":"Turns the user into the type of the ground it's fighting on: GRASS on fields and in forests, WATER at sea, ROCK in caves and on cliffs, GROUND on beaches, ICE in ice caves, FIRE in volcanoes, NORMAL indoors. It lasts until it's switched out.","charge":"Raises SP. DEF 1 stage and charges the user: its next damaging ELECTRIC move has double power (the charge is used up when that move hits).","curse":"Used by a GHOST type: the user loses half its max HP and curses the target, which then loses 1/4 of its max HP every 3 s until it leaves the field (fails on a cursed target). Used by anything else: SPEED −1, ATTACK +1, DEFENSE +1.","destinybond":"For 4 s, if a foe's attack knocks the user out, the attacker faints too.","disable":"The move the target used last can't be used for at least 7 s (its cooldown is pushed up); it fails if the target hasn't used a move yet or that move was a signature move.","dragonrage":"Always deals exactly 40 damage, whatever the stats, STAB or type matchup.","encore":"For 6 s the target is stuck on the move it used last: any other move it starts turns into that one. It fails if the target hasn't used a move, if that move was ENCORE, TRANSFORM, MIMIC or STRUGGLE, or if the target is already encored.","endeavor":"Brings the target's HP down to the user's: the damage is the target's HP minus the user's. Nothing happens if the target doesn't have more HP than the user (GHOST types are immune).","endure":"For 1.6 s the user survives any hit with 1 HP left (as long as it had more than 1).","explosion":"A 250-power blast after which the user faints, even if the target dodges, protects itself or takes no damage. It doesn't halve the target's DEFENSE here, can catch a target in the air but hits only the one foe it is aimed at (cooldown about 11 s; rarely picked above 1/4 HP).","fakeout":"Works only as the first move the user makes after coming out; after that it fails and still goes on cooldown. Its 100% flinch rarely adds anything, because any contact hit already knocks the target out of the move it's making.","followme":"For 4 s, every foe targets the user (useful in double battles).","foresight":"The user's next move that has an accuracy roll passes it for sure (FORESIGHT, ODOR SLEUTH), though the target can still dodge. It doesn't let NORMAL or FIGHTING moves hit GHOST types.","future":"FUTURE SIGHT foresees an attack instead of hitting now: 3.5 s later a 120-power special attack strikes the target's side once, and it can't be dodged. Each user can have only one foreseen attack waiting.","grudge":"For 4 s, if a foe's attack knocks the user out, that attack goes on a 30 s cooldown for the attacker.","haze":"Resets every stat stage of every POKéMON on the field to 0.","helpinghand":"The user's partner's next damaging move has 1.5× power. It fails without a partner (double battles only).","hyperbeam":"If it lands, the user has to recharge: for 1.4 s any move it tries to start stalls for 0.5 s instead. A miss costs no recharge.","imprison":"For 12 s the foes can't use any move the user also knows: trying wastes 0.45 s and puts that move on a 1.5 s cooldown.","lightscreen":"For 12 s, special damage to the user's side is halved (critical hits ignore it). It fails while already up; BRICK BREAK shatters it.","lockon":"The user's next move that has an accuracy roll passes it for sure (LOCK-ON, MIND READER), though the target can still dodge it.","meanlook":"The target can't be switched out, run from or flee for as long as the user stays in battle (a held SMOKE BALL still gets away). It fails if the target is already trapped this way.","memento":"The user faints, and the target's ATTACK and SP. ATK each fall by 2 stages.","metronome":"Picks a random move from nearly every non-signature move that deals damage or causes a status or stat change, and the user uses it right away.","mimic":"Replaces MIMIC with the target's last-used move (not a signature move) for the rest of the battle; it fails if the target hasn't used one. MIMIC comes back when the battle ends.","minimize":"Raises evasion 2 stages; each evasion stage also makes the POKéMON 10% keener to dodge. No other effect.","mirrorcoat":"The user braces for 2 s: the first special hit it takes in that time is paid back to the attacker at twice the damage taken.","mirrormove":"Copies the target's last-used move (not a signature move) and uses it at once; it fails if there's none.","synthesis":"Restores 50% of max HP (SYNTHESIS, MOONLIGHT). The weather doesn't change the amount.","nightmare":"Works only on a sleeping target: while it sleeps it loses 1/4 of its max HP every 3 s. The nightmare ends when it wakes.","payday":"Each hit by your POKéMON scatters coins worth 5 × its level. You pick them up only if you win the battle (not if you run, and not if you catch the foe).","psychup":"Copies all of the target's stat stages onto the user.","raindance":"Rain for 15 s: WATER moves ×1.5, FIRE moves ×0.5, on both sides.","recover":"Restores 50% of the user's max HP.","reflect":"For 12 s, physical damage to the user's side is halved (critical hits ignore it). It fails while already up; BRICK BREAK shatters it.","rest":"The user is fully healed and cured, then sleeps for exactly 5 s. It fails at full HP with no status.","revenge":"Double power (120) if the user took damage from an attack in the last 2 s.","roar":"Deals no damage. It's a sound wave that can't miss or be dodged, and it blasts the target backwards; it doesn't force a switch.","roleplay":"The user copies the target's species trait (flier, heavy, curler, cocoon or cheeks: see Species traits); it fails if the target has none. There are no abilities in this game.","safeguard":"For 12 s, foes and arena hazards can't give the user's side a status problem, confusion or LEECH SEED (trapping moves still work).","secretpower":"A 70-power hit with a 30% chance to paralyze a target that has no status. It's always paralysis, whatever the arena.","solar":"Without harsh sun the user takes in sunlight for 1.1 s before firing; in sun it fires at once. Like other big moves it also powers up for 0.5 s.","sonicboom":"Always deals exactly 20 damage (GHOST types are immune).","spikes":"Scatters spikes on the foes' side, up to 3 layers. Every foe sent out afterwards (switch-ins and replacements alike) that isn't FLYING-type loses 1/8, 1/6 or 1/4 of its max HP for 1, 2 or 3 layers; they stay for the whole battle.","spitup":"Power is 100 per stockpiled layer (100–300); with nothing stockpiled it fails and still goes on cooldown. The layers are used up when it hits.","splash":"Does nothing at all.","stockpile":"Stores a layer, up to 3, for SPIT UP and SWALLOW, and raises DEFENSE and SP. DEF 1 stage each time. The layers stay until they're used or the user leaves the field.","swallow":"Uses up the stockpile to heal: 25%, 50% or 100% of max HP for 1, 2 or 3 layers. With nothing stockpiled it fails.","teleport":"In a wild battle your POKéMON teleports you away (the battle ends as if you ran); a wild POKéMON that uses it starts fleeing for the edge of the arena. It fails in trainer battles.","thief":"If the user isn't holding anything, it takes the target's held item. An item a foe steals from one of your POKéMON comes back after the battle; what yours steal, they keep.","trick":"Swaps held items with the target; it fails if neither holds one. Items a foe's TRICK takes from your POKéMON come back after the battle; what yours get, they keep.","watersport":"For 12 s, FIRE moves deal half damage on both sides.","yawn":"Makes the target drowsy: 2.5 s later it falls asleep for 3.5–6 s if it still has no status. It fails on a target that has a status or is already drowsy.","batonpass":"Once the move is over, the user switches out for the best POKéMON left on its bench, which inherits its stat stages, focus, SUBSTITUTE, confusion, seeds, curses, roots, perish count and MEAN LOOK. It fails with nobody to pass to (wild POKéMON have no bench).","conversion":"Turns the user into the type of one of its own moves (picked at random among types it isn't already), until it's switched out.","conversion2":"Turns the user into a random type that resists the move the target used last, until it's switched out. It fails if the target hasn't used a move.","counter":"The user braces for 2 s: the first physical hit it takes in that time is paid back to the attacker at twice the damage taken.","detect":"Works like PROTECT: every attack that reaches the user in the next 1.4 s is blocked. Its cooldown is 5 s.","dreameater":"Only affects a sleeping target (anything awake 'wasn't affected'). It restores half of the damage dealt to the user.","facade":"Double power (140) while the user is burned, poisoned or paralyzed. A burn still halves its ATTACK.","falseswipe":"Never knocks the target out: a hit that would leaves it at 1 HP.","focuspunch":"The user tightens its focus as the move starts; if a foe's attack damages it before the punch lands, it loses focus and the punch does nothing (the cooldown is still spent).","hail":"Hail for 15 s: every POKéMON that isn't ICE-type loses 1/16 of its max HP every 3 s. It also ends natural rain.","hiddenpower":"Its type and power come from the user's IVs (Gen 3 formula): any type except NORMAL, power 30–70. STAB and type matchups use that type; held type boosters and MUD SPORT / WATER SPORT go by that type too.","ingrain":"The user puts down roots and restores 1/16 of its max HP every 3 s for as long as it stays in. It can still be switched out; it fails if already rooted.","knockoff":"Knocks the target's held item away for the rest of the battle. If it was one of your POKéMON's items, it comes back afterwards.","mist":"For 12 s, foes' moves can't lower the stats of the user's side (GUARD SPEC. does the same).","nightshade":"Deals damage equal to the user's level (NORMAL types are immune). STAB, critical hits, screens and held items don't change it.","perishsong":"Every POKéMON on the field that hears it, the user included, faints when its 9.5 s count runs out (shown as PERISH 3, 2, 1). Switching a POKéMON out clears its count.","recycle":"Brings back the berry the user ate last in this battle, as long as it's holding nothing.","refresh":"Cures the user's burn, poison (bad poison too) or paralysis; it fails otherwise.","skillswap":"The user and the target swap species traits (see Species traits). There are no abilities in this game.","sleeptalk":"Only works while the user is asleep: a sleeping POKéMON that knows it uses it every 2–3 s, calling one of its other moves at random (not two-step moves or signatures). Awake, it fails.","snatch":"For 2.5 s, the next move a foe uses on itself (healing, stat boosts and the like) is stolen: the snatcher gets its effect instead.","snore":"Only works while the user is asleep: a sleeping POKéMON that knows it lets out a SNORE every 2–3 s. Awake, it fails.","softboiled":"Restores 50% of the user's max HP.","spite":"The move the target used last goes on a cooldown of at least 6 s.","substitute":"The user pays 1/4 of its max HP (it fails if it doesn't have more than that) to make a doll with that much HP. Damaging hits drain the doll instead of the user, with none of their side effects; the foe's status moves fail against it until it breaks.","sunnyday":"Harsh sun for 15 s: FIRE moves ×1.5, WATER moves ×0.5, and SOLAR BEAM fires without charging. It also ends natural rain.","taunt":"For 7 s the target can't use status moves: trying wastes 0.45 s and puts that move on a 1.2 s cooldown.","torment":"For 9 s the target can't use the same move twice in a row: trying wastes 0.45 s.","toxic":"Badly poisons the target: every 3 s it loses 1/16 of its max HP, then 2/16, 3/16 and so on up to 15/16. POISON and STEEL types are immune, and it becomes ordinary poison once the POKéMON leaves the field.","transform":"The user becomes the target, taking its species, moves, stats (but not HP), stat stages and look until it leaves the field or the battle ends. It fails if either one is already transformed.","uproar":"A 90-power special hit that wakes every sleeping POKéMON on the field; for the next 5 s, moves can't put anyone to sleep.","triattack":"An 80-power special NORMAL hit with a 20% chance to burn or paralyze (picked at random) a target that has no status. It never freezes."},"fields":{"p":"Power, used in the Gen 3 damage formula (see Damage). 0 means the move does no formula damage: it's a status move, or a fixed-damage move such as SEISMIC TOSS. Power also lengthens the move's cooldown.","a":"Accuracy in %, rolled when the move is used. It's adjusted by the user's accuracy stage minus the target's evasion stage, and works at 60% against a target hidden underground, in the air or in tall grass. A miss means the target simply slips aside without spending its dodge. 0 or blank means the move never misses and also can't be dodged (AERIAL ACE, SWIFT, signature moves...); PROTECT still blocks it.","c":"Category: P physical, S special, X status. The physical/special split goes by the move, as in Gen 4 and later: the game's own per-move list comes first, then this field, then Gen 3's split by type. Physical moves use ATTACK against DEFENSE, are halved by a burn and by REFLECT, are boosted by a CHOICE BAND and paid back by COUNTER; special moves use SP. ATK against SP. DEF, LIGHT SCREEN, CHOICE SPECS and MIRROR COAT.","ail":"The status the move can cause, applied when it lands (after the damage): PAR, SLP, PSN, TOX (bad poison), BRN, FRZ, CNF (confusion), TRAP (bound), SEED (LEECH SEED), INFAT (infatuation) or DISABLE. A POKéMON with a status can't get a second one; POISON and STEEL types can't be poisoned, FIRE types can't be burned, GRASS types can't be seeded and GROUND types ignore THUNDER WAVE. SAFEGUARD blocks everything except trapping.","ac":"Chance in % that the status is applied when the move lands (100 = always). A damaging move only passes it on if the hit lands and the target survives.","st":"Stat-stage changes: each entry is a stat and a number of stages, applied when the move lands (skipped if the hit knocks the target out). Stages run from −6 to +6 and last until the POKéMON leaves the field.","sc":"Chance in % that the stat change happens; blank means always.","sw":"Who gets the stat change: 'self' is the user; anything else is the target. Drops aimed at a foe are blocked while its side has MIST.","pri":"Priority from the original games. Battles here run in real time, so it doesn't make a move go first or last. Its only use is that on HARD and EXTREME, trainers' POKéMON favour a positive-priority attack that would finish off a weakened foe. What does make an attack quick is its staging: QUICK ATTACK, PURSUIT and AERIAL ACE strike in a blink and are much harder to dodge.","hit":"[min, max]: the move strikes that many times in one use, rolled evenly between min and max. Accuracy and the target's dodge are decided once for the whole move; each strike rolls its own damage, critical hit and side-effect chances, and the move stops early if the target faints. The cooldown runs once.","dr":"Positive: the user heals that % of the damage it dealt (at least 1 HP). Negative: the user takes that % of the damage dealt as recoil (at least 1). STRUGGLE's recoil is 1/4 of the damage dealt.","hl":"The user restores that % of its max HP when it uses the move.","fl":"Chance in % to make the target flinch. It only matters when the target is in the middle of a move that the hit didn't interrupt (contact hits and heavy hits usually interrupt it anyway): the next move it tries is then cancelled for 0.35 s, though nothing is spent.","cr":"High critical-hit ratio: +1 critical stage, 1/8 instead of 1/16. It stacks with FOCUS ENERGY or DIRE HIT (+2) and an ambush (+1), up to 1/4, 1/3 and 1/2.","crash":"JUMP KICK and HIGH JUMP KICK: if the attack misses (dodged or blocked included), the user keeps going and crashes, taking half the damage it would have dealt, at most half its max HP.","ct":"Contact move. These play out as melee strikes (rushes, arcs, leaps, blinks, flurries): they can't reach a POKéMON hovering in the air, knock the target out of a move in progress, clash when two meet head-on, and a whiff leaves the attacker open.","so":"Sound move. Sound waves, like gazes, can't be dodged. There are no abilities, so nothing is immune to sound.","tg":"Targeting from the data (self, ally, team, field, foes, one). Moves on the user, its side or the field play out on the user and can't be dodged. Every attack hits only the one opponent the user is fighting, even 'foes' moves like EXPLOSION; in double battles each POKéMON picks its own target.","sig":"Signature move: each species has one. It unlocks when the SPIRIT meter is full and empties it. It has 80 power, never misses, can't be dodged, always lands a critical hit and has no cooldown; a 1.3 s cut-in freezes the battle as it starts.","cooldown":"Each move recharges on its own clock once it's used (moveCool). Damaging moves take 1.4 + power/30 + (30 − PP)/18 seconds, with the PP term never below 0 and fixed-damage moves counted as power 50: QUICK ATTACK 2.7 s, THUNDERBOLT 5.4 s, HYPER BEAM 7.8 s. Status moves take 9 s for sleep, 8 for LEECH SEED, 7 for paralysis, poison or confusion, 6 for PROTECT, FOCUS ENERGY and AGILITY, 5 for moves on the user and 4.5 for the rest; STRUGGLE takes 2.2 s and signature moves have none.","pp":"PP is never used up: moves never run dry, and their cooldowns pace them instead. The original PP only feeds the cooldown, adding 1/18 s for every PP below 30.","ppup":"PP UP and PP MAX power up a POKéMON's signature move for good. Each step makes the signature's whole cast play 10% faster and makes every SPIRIT gain 10% bigger, up to 3 steps (30%). A PP UP adds one step and a PP MAX gives all three; the steps carry through evolution. They don't change move cooldowns."},"glossary":[{"section":"Battle basics","term":"Real-time battles","text":"POKéMON fight on their own and in real time: each one reads the matchup, picks its own moves, circles its opponent and decides when to dodge. You work the command bar: BAG, POKéMON (switch) and RUN. Pressing A, B or START freezes the battle ('Time stands still') while you choose. Where move effects talk about turns, a turn is about 3 seconds."},{"section":"Battle basics","term":"How moves are chosen","text":"Every move a POKéMON knows is scored by what it gains over the next few exchanges: damage and knockouts, status and seeds over time, stat changes that pay off in a long fight. One is then picked with some randomness that depends on nature. Moves still cooling down can't be picked; if the best one is under 1.1 s from ready and the rest are poor, the POKéMON waits for it (reckless ones don't). Status moves lose appeal each time they're used."},{"section":"Battle basics","term":"Cooldowns","text":"A move can't be used again until its own cooldown runs out; the move panel shows each one counting down. Damaging moves take 1.4 + power/30 + (30 − PP)/18 seconds, and status moves 4.5–9 s, sleep moves the longest. Moves never run out of PP, so a POKéMON cycles through its moveset as each move comes back. ETHERs and ELIXIRs recharge every move at once."},{"section":"Battle basics","term":"SPEED and the action gap","text":"After every move a POKéMON waits a short gap before starting the next: 1.8 × 40 / (SPEED + 28) seconds, kept between 0.7 and 2.3 s, scaled by nature and varied a little. A POKéMON with 12 SPEED waits about 1.8 s; one with 75 or more waits only 0.7 s. The SPEED used is the stat × its stage, ×0.25 when paralyzed, ×1.5 with a CHOICE SCARF and ×0.5 with a MACHO BRACE. SPEED also sets how fast a POKéMON moves, how quickly its dodge recharges, how well it reacts to attacks and your odds of running."},{"section":"Battle basics","term":"Dodging","text":"Every POKéMON has one dodge (the meter on its plate) that recharges in 5.6 − SPEED/22 seconds, between 2.8 and 6 s, scaled by nature. When an attack arrives it decides whether to spend it: big hits, KOs and sleep moves yes, light jabs maybe. The chance grows with the threat and with its SPEED compared to the attacker's, and is capped at 92%. It can't dodge while asleep, bound, staggered, open, mid-move (except while winding up or recovering) or holding a CHOICE item. Counters, tag-ins, ambushes, homing SWIFT, never-miss moves and sound or gaze moves can't be dodged; beams are harder to dodge and lightning or blink strikes much harder."},{"section":"Battle basics","term":"Counters","text":"A clean dodge gives the dodger a 1.6 s counter window: its next move starts within 0.15–0.4 s, is called out as 'Counter!', can't be dodged and earns 6 extra SPIRIT if it hits. Every clean dodge also adds 15 SPIRIT. The dodger itself is open for 0.4 s as it lands, so the dodge isn't free. A dodge baited by a trainer's feint gives no counter."},{"section":"Battle basics","term":"Openings","text":"An opening is a moment when a POKéMON is wide open (a gold sparkle over it). It happens after a missed contact rush (1 s, 1.4 s in rain) or a missed ranged move (about 0.5 s), when a heavy hit knocks it back (18% of max HP or more, a critical or a super-effective hit: about 0.95 s), when paralysis (0.7 s), love (0.6 s) or a confused self-hit (0.8 s) stops it, after a clash, a drawn beam struggle, a wall slam or a hazard stagger, and for 0.4 s after its own dodge. An open POKéMON can't dodge, its opponent drops everything to punish it, and hits on it give extra SPIRIT. While the foe is open, RUN always works in a wild battle, and a switch becomes a tag-in."},{"section":"Battle basics","term":"Tag-in strikes","text":"Switch while either your outgoing POKéMON or the foe is open, and the newcomer bursts out of its ball straight into its strongest damaging attack. That attack's cooldown is reset, it can't be dodged, and it knocks the foe out of whatever move it was making ('INTERCEPTED'), leaving the foe open for 0.9 s."},{"section":"Battle basics","term":"Switching","text":"Choose POKéMON in the command bar to recall one and send in another; a bound POKéMON can't be recalled. After a switch you have to wait 20 s of battle before the next. As coded, this applies in every battle on every difficulty; sending in a replacement for a fainted POKéMON doesn't count. On HARD and EXTREME, trainers switch too, under the same 20 s rule, and the newcomer arrives open for 0.6 s."},{"section":"Battle basics","term":"SPIRIT","text":"The SPIRIT meter (0–100) fills as a POKéMON fights. Landing a hit adds 5 + 34 × the share of the target's max HP it took (+5 on an open target, +6 for a counter). Taking a hit of 15% of max HP or more adds 5 + 32 × that share (smaller hits +2), and a clean dodge, winning a beam struggle (+15 each) or hanging on at 1 HP (+35) add more. PP UPs raise every gain by 10% per step. SPIRIT stays with a POKéMON when it's switched out but empties at the end of every battle."},{"section":"Battle basics","term":"Signature moves","text":"With SPIRIT full, the fifth move (★) lights up: the species' signature. The POKéMON fires it when its ready moves can't finish the foe, when it's in danger, or now and then on a whim. The battle freezes for a 1.3 s cut-in; the move has 80 power, never misses, can't be dodged and is always a critical hit, but PROTECT still blocks it. Using it empties SPIRIT, and there's no cooldown."},{"section":"Battle basics","term":"Who gets which signature","text":"Some species have their own: the BULBASAUR line FRENZY PLANT, the CHARMANDER line BLAST BURN, the SQUIRTLE line HYDRO CANNON, PIKACHU VOLT TACKLE, PIDGEY, PIDGEOTTO and PIDGEOT SKY ATTACK, SPEAROW and FEAROW BRAVE BIRD, RATTATA and RATICATE CRUNCH, MANKEY FOCUS PUNCH, SANDSHREW EARTHQUAKE, GEODUDE ROCK WRECKER, ONIX STONE EDGE, CATERPIE and BUTTERFREE SILVER WIND, METAPOD SIGNAL BEAM, WEEDLE and BEEDRILL MEGAHORN, KAKUNA SLUDGE BOMB. Everyone else gets one by their first type: NORMAL GIGA IMPACT, FIRE BLAST BURN, WATER HYDRO CANNON, GRASS FRENZY PLANT, ELECTRIC VOLT TACKLE, BUG MEGAHORN, POISON SLUDGE BOMB, FLYING SKY ATTACK, ROCK ROCK WRECKER, GROUND EARTHQUAKE, FIGHTING FOCUS PUNCH, PSYCHIC PSYCHIC, GHOST SHADOW BALL, DARK CRUNCH, ICE BLIZZARD, DRAGON DRACO METEOR, STEEL METEOR MASH. Each is physical or special like the move it's named after: GIGA IMPACT, VOLT TACKLE, BRAVE BIRD, SKY ATTACK, FOCUS PUNCH, MEGAHORN, CRUNCH, EARTHQUAKE, STONE EDGE, ROCK WRECKER and METEOR MASH are physical; the rest are special."},{"section":"Battle basics","term":"Double battles","text":"A trainer battle becomes a double battle whenever the trainer has two or more POKéMON and you have two that can fight: two a side, each picking its own target. A target is chosen by who it can hurt most and who is after it, and held for a few seconds. When a lead falls, its partner steps up and the next POKéMON fills the empty slot. FOLLOW ME and HELPING HAND only matter here, and on HARD and EXTREME the two foes gang up on one of yours."},{"section":"Battle basics","term":"Clashes and beam struggles","text":"Two contact rushes that meet mid-move clash: no damage, both are thrown back and left open for 0.7 s. Two projectiles that meet in the air cancel out. When one side fires a ranged energy attack while the other's is still in flight, they lock into a 2–3 s tug of war decided by attacking stat × power × STAB × type matchup × weather × remaining HP, plus random surges. The winner's attack hits at 60% damage (+15 SPIRIT); a near draw throws both back, open for 0.8 s. POKéMON sometimes answer an incoming energy attack on purpose (reckless ones most often)."},{"section":"Battle basics","term":"Trainer calls and feints","text":"A trainer's POKéMON have their moves called out just before they use them, which gives you a tell. GYM LEADERS, your rival (who remembers how your starter fought) and every trainer on EXTREME also read your habits: once you've dodged twice, each call has up to a 50% chance to be a feint. A feint is a fake lunge that baits your dodge, which is then spent with no counter, followed by the real attack. Called attacks are a little easier to dodge."},{"section":"Battle basics","term":"Big moves wind up","text":"Any move with 65 or more power, and every beam, lightning bolt, falling-rock, ground-blast or grab move, spends 0.5 s gathering power before it fires: a moment to dodge or to hit the attacker out of it. PIKACHU's cheeks spark for 0.35 s before its ELECTRIC moves. Signature moves skip this, because they have their own cut-in."},{"section":"Battle basics","term":"Clutch moments and bond","text":"When your last POKéMON standing drops to 1/4 HP, the music turns to a heartbeat. Bond grows by 1 for every step your lead POKéMON walks behind you (2 with a SOOTHE BELL). At 250 bond, shown as five hearts on its summary, it hangs on at 1 HP once per battle instead of fainting, and gains 35 SPIRIT. Turning clutch moments off in the options turns this off too."},{"section":"Battle basics","term":"Winning, losing and money","text":"You win when every foe has fainted. A trainer pays prize money, doubled while an AMULET COIN is in the BAG, and many hand over EXP. CANDIES; a wild win has a 15% chance to turn up an EXP. CANDY S (or 1 in 5 times an M). If all your POKéMON faint, you black out to the last POKéMON CENTER (or home) with the team healed, losing half your money after a trainer battle but nothing after a wild one."},{"section":"Battle basics","term":"Running away","text":"You can only run from wild battles. You get away for sure if your POKéMON holds a SMOKE BALL, if the foe is open or already fleeing, or if your POKéMON's SPEED is at least the foe's. Otherwise the odds are (your SPEED × 128 / foe's SPEED + 30 × tries) out of 256. A POKé DOLL always works, and so does TELEPORT used by your POKéMON."},{"section":"Battle basics","term":"Catching","text":"You can't throw a BALL at a wild POKéMON that can still fight. Beat it: it hangs on at 1 HP, and you get 3 throws plus one per badge before it gets away (one-off POKéMON that stand their ground wait for you). Each throw uses the Gen 3 catch formula on its species' catch rate: POKé BALL ×1, GREAT ×1.5, ULTRA ×2, SAFARI ×1.5, NEST (40 − level)/10 but at least ×1, NET ×3 on WATER and BUG types, and MASTER BALL always. Asleep is ×2 and any other status ×1.5. A caught POKéMON comes out fully healed, and goes to the PC if your party is full."},{"section":"Battle basics","term":"Wild POKéMON that flee","text":"A wild POKéMON down to 1/4 HP may make a break for the arena's edge. Cautious and evasive ones try soonest, reckless ones hardly ever. If it reaches the edge it escapes and the battle ends with no EXP. Putting it to sleep or binding it stops the escape, and RUN always works while it flees."},{"section":"Statuses","term":"Paralysis (PAR)","text":"A paralyzed POKéMON's effective SPEED is quartered, which lengthens its gaps and dodge recharge and slows its feet. Each time it starts a move there's a 25% chance it can't move: it loses 0.6 s and is open for 0.7 s, but the move isn't spent. Its dodge chance is halved. It lasts until cured; only GROUND types are safe, and only from THUNDER WAVE."},{"section":"Statuses","term":"Sleep (SLP)","text":"A sleeping POKéMON can't act, move or dodge, and getting hit doesn't wake it. Sleep from moves lasts 3.5–7 s, from YAWN 3.5–6 s and from REST exactly 5 s; hazard spores give 3–5.5 s. The POKé FLUTE and UPROAR wake everyone, and a POKéMON still asleep when a battle ends wakes up as soon as it's next sent out."},{"section":"Statuses","term":"Poison (PSN)","text":"A poisoned POKéMON loses 1/8 of its max HP every 3 s of battle until cured. POISON and STEEL types can't be poisoned, by moves or by hazards."},{"section":"Statuses","term":"Bad poison (TOX)","text":"From TOXIC, POISON FANG and EXTREME's poison vents. The damage grows with every 3 s tick: 1/16 of max HP, then 2/16, 3/16 and so on up to 15/16. It shows as PSN, and once the POKéMON leaves the field it becomes ordinary poison (1/8 per tick)."},{"section":"Statuses","term":"Burn (BRN)","text":"A burned POKéMON loses 1/8 of its max HP every 3 s, and its physical moves (decided by the move, not its type) deal half damage. FIRE types can't be burned. Separately, standing in scorched ground hurts any non-FIRE POKéMON for 1/16 of its max HP a second."},{"section":"Statuses","term":"Freeze (FRZ)","text":"ICE BEAM, BLIZZARD, ICE PUNCH and POWDER SNOW have a 10% chance to freeze. A frozen POKéMON can't move or act for 2.5–5 s, then thaws by itself. ICE types can't be frozen, nor can anything in harsh sunlight. An ICE HEAL, a held ASPEAR or LUM BERRY, a FULL HEAL or a POKéMON CENTER clears it at once."},{"section":"Statuses","term":"Confusion","text":"Confusion lasts for 2–5 of the POKéMON's move attempts (2–4 from hazards), and the last attempt goes through normally. Each attempt before that has a 50% chance that it hurts itself instead: a typeless 40-power physical hit from its own ATTACK against its own DEFENSE, a 0.45 s stagger and a 0.8 s opening. While confused it dodges less (×0.6). PERSIM and LUM BERRIES cure it; it ends when the POKéMON leaves the field."},{"section":"Statuses","term":"Flinch","text":"A flinch only lands on a POKéMON in the middle of a move that the hit didn't interrupt (contact hits and heavy hits usually interrupt it anyway). Its next move attempt is then cancelled for 0.35 s, though nothing is spent."},{"section":"Statuses","term":"LEECH SEED","text":"A seeded POKéMON loses 1/8 of its max HP every 3 s and the seeder regains as much. GRASS types can't be seeded. The seed falls off when the seeded POKéMON leaves the field or uses RAPID SPIN; SAFEGUARD keeps it off."},{"section":"Statuses","term":"Bound (trapped)","text":"BIND, WRAP, CLAMP, FIRE SPIN and SAND TOMB hold the target for 3–5.5 s, taking 1/16 of its max HP every 1.6 s. A bound POKéMON can't dodge or slip aside, barely moves, counts down to its next move at half speed and can't be recalled. RAPID SPIN breaks free; SAFEGUARD doesn't stop it, and a second bind doesn't stack."},{"section":"Statuses","term":"Infatuation","text":"ATTRACT makes the target fall in love for 8 s, whatever the genders: each move it starts has a 50% chance to fail, losing 0.6 s and leaving it open for 0.6 s."},{"section":"Statuses","term":"Lingering move effects","text":"Many effects run on timers instead of turns: CURSE (1/4 HP every 3 s) and NIGHTMARE (1/4 every 3 s while asleep) last until the POKéMON leaves. YAWN puts the target to sleep after 2.5 s and PERISH SONG makes it faint after 9.5 s. TAUNT lasts 7 s, TORMENT 9 s, ENCORE 6 s, DISABLE 7 s, SPITE 6 s and IMPRISON 12 s; DESTINY BOND and GRUDGE stay armed for 4 s. Everything tied to a POKéMON (stages, confusion, seeds, curses, substitutes) ends when it's switched out."},{"section":"Statuses","term":"Immunities and cures","text":"A POKéMON can only have one status at a time (PAR, SLP, PSN, BRN or FRZ), and it stays after the battle until healed (sleep ends the next time the POKéMON is sent out). Type immunities: POISON and STEEL can't be poisoned, FIRE can't be burned, GRASS can't be seeded and GROUND ignores THUNDER WAVE; an attack a type is immune to brings none of its side effects. SAFEGUARD shields a side from statuses for 12 s. Cures: status medicine and berries (also held, see Held berries), FULL HEAL, FULL RESTORE, REST, REFRESH, AROMATHERAPY, a POKéMON CENTER and NURSE JOY's CHANSEY."},{"section":"Stats","term":"Stat stages","text":"Stages run from −6 to +6. ATTACK, DEFENSE, SP. ATK, SP. DEF and SPEED are multiplied by (2 + n)/2 when raised and 2/(2 − n) when lowered; accuracy and evasion by (3 + n)/3 and 3/(3 − n), using the attacker's accuracy stage minus the target's evasion stage (capped at ±6). Each evasion stage also makes a POKéMON 10% keener to dodge. Stages show as chips under the HP bar and reset when the POKéMON leaves the field; HAZE clears everyone's and PSYCH UP copies them."},{"section":"Stats","term":"Damage","text":"Damage follows Gen 3: ((2 × level / 5 + 2) × power × attack / defense) / 50 + 2, rounded down at each step. That is ×2 on a critical hit, ×1.5 STAB, × type effectiveness and × weather, then a random 85–100% roll, halved by REFLECT or LIGHT SCREEN (not on crits), and never below 1 unless the target is immune. Then come held items (type booster ×1.1, CHOICE BAND or SPECS ×1.5), MUD SPORT or WATER SPORT (×0.5), a puddle under the target (ELECTRIC ×1.5) and a curled-up CATERPIE (contact ×0.75)."},{"section":"Stats","term":"Physical and special","text":"Whether an attack is physical or special goes by the move itself, as in Gen 4 and later: THUNDERPUNCH is physical, SHADOW BALL special. Moves the game's list doesn't cover fall back to their own category, then to Gen 3's split by type. Physical moves use ATTACK against DEFENSE and special moves SP. ATK against SP. DEF; that also decides which screen halves a move, what a burn weakens, which CHOICE item boosts it and whether COUNTER or MIRROR COAT pays it back."},{"section":"Stats","term":"Type effectiveness and STAB","text":"Types use the Gen 3 chart (17 types, no FAIRY), so STEEL resists GHOST and DARK. Matchups multiply for dual types (×4 to ×0.25), and an immunity (×0) stops the attack and all its side effects. A move that shares a type with its user gets ×1.5 STAB. Fixed-damage moves only respect immunities, and STRUGGLE ignores types altogether."},{"section":"Stats","term":"Critical hits","text":"The critical stage starts at 0. A high-crit move adds 1, FOCUS ENERGY or DIRE HIT add 2 and an ambush adds 1, for chances of 1/16, 1/8, 1/4, 1/3 and 1/2 at stages 0–4. A critical hit does double damage, ignores the attacker's lowered attack and the target's raised defense, and goes through REFLECT and LIGHT SCREEN. Signature moves are always critical; fixed-damage moves never are."},{"section":"Stats","term":"Accuracy and missing","text":"A move's accuracy is rolled when it's used, adjusted by accuracy and evasion stages, and works at 60% against a POKéMON hidden underground, in the air or in tall grass. LOCK-ON, MIND READER, FORESIGHT and ODOR SLEUTH make the next roll a sure pass. A miss means the target slips aside without spending its dodge; dodging is a separate, second chance to avoid a hit that would have landed. Moves with no accuracy never miss and can't be dodged."},{"section":"Stats","term":"IVs","text":"Each stat has an IV from 0 to 31, random for wild and gift POKéMON and a perfect 31 across the board for EXTREME trainers' teams. Stats use the Gen 3 formula without EVs: HP = (2 × base + IV) × level / 100 + level + 10, and each other stat = ((2 × base + IV) × level / 100 + 5) × nature. IVs also set HIDDEN POWER's type and power."},{"section":"Stats","term":"Vitamins","text":"HP UP, PROTEIN, IRON, CALCIUM, ZINC and CARBOS raise one stat's IV by 4, up to 31, and its stat goes up at once. There are no EVs in this game. They can't be used on a fainted POKéMON, and they sell at the CELADON DEPT. STORE 5F for ¥9,800."},{"section":"Stats","term":"Natures and fighting styles","text":"A nature raises one stat by 10% and lowers another by 10%, as in the originals, and it also sets how the POKéMON fights. Balanced: HARDY, DOCILE, SERIOUS. Reckless: LONELY, BRAVE, NAUGHTY, RASH (fights up close, short gaps, rarely dodges). Aggressive: ADAMANT, HASTY. Steady: BOLD, RELAXED, IMPISH, QUIET, CALM, CAREFUL (likes setup moves). Erratic: LAX, NAIVE, SASSY, QUIRKY (hard to predict). Evasive: TIMID, JOLLY (keeps its distance, dodges most, recharges its dodge fastest). Cautious: MODEST, MILD, BASHFUL, GENTLE (keeps far back, likes setup)."},{"section":"Stats","term":"Battle memory","text":"Each POKéMON keeps a record of battles, clean dodges, counters and comebacks (wins after dropping to 1/4 HP). Over time its style drifts toward what it keeps doing: 'learning to dodge' (evasive), 'learning to counter' (aggressive) or 'never gives up' (steady). The record and the learned style show on its summary."},{"section":"Moves","term":"Fixed-damage moves","text":"SEISMIC TOSS and NIGHT SHADE deal the user's level in damage, SONICBOOM 20, DRAGON RAGE 40, SUPER FANG half the target's HP and ENDEAVOR the gap between the two POKéMON's HP. FISSURE, HORN DRILL, GUILLOTINE and SHEER COLD knock out any target whose level isn't above the user's. None of them get STAB, crits, screens or held-item boosts, but type immunities still apply."},{"section":"Moves","term":"Priority","text":"The priority listed for moves like QUICK ATTACK, PROTECT or ROAR comes from the original games, and in real time it doesn't change who goes first. Speed of action comes from SPEED (the action gap) and from how a move is staged: QUICK ATTACK, PURSUIT and AERIAL ACE strike in a blink and are much harder to dodge. On HARD and EXTREME, trainers do favour a positive-priority attack to finish off a weakened foe."},{"section":"Moves","term":"How attacks play out","text":"Contact moves are melee strikes (rushes, curving arcs, leaps, blinks, spins and flurries); they can't reach a flier in the air and always knock the target out of a move in progress. Ranged moves fly as projectiles, beams or lightning: a projectile that misses flies on past, and rocks can block one. Gazes and sound waves (HYPNOSIS, SING, GROWL...) can't be dodged, while powders can. Ground blasts like MAGNITUDE miss anything in the air."},{"section":"Moves","term":"Moves never run dry","text":"There's no PP to run out of and no need for ETHERs to restore it: every move recharges on its own cooldown. ETHER and MAX ETHER recharge all of one POKéMON's moves at once in battle; ELIXIR and MAX ELIXIR recharge its dodge as well. A POKéMON only STRUGGLES when nothing it knows can affect any foe, such as NORMAL moves against GHOSTS."},{"section":"Moves","term":"TMs, HMs, tutors and the reminder","text":"TMs and HMs are never used up: teach their move as often as you like to any POKéMON that can learn it. Every POKéMON CENTER has a MOVE TUTOR, who teaches FireRed's tutor moves (MEGA PUNCH, SWORDS DANCE, BODY SLAM, COUNTER, SEISMIC TOSS, SUBSTITUTE and more) for ¥1,000 a lesson. It also has a MOVE REMINDER, who brings back any level-up move a POKéMON has already passed, for free."},{"section":"Field","term":"Weather","text":"Rain from the overworld weather falls on outdoor arenas: WATER moves ×1.5, FIRE ×0.5, three puddles at the start, longer-lasting puddles, shorter fires, and slick ground that makes missed rushes skid and stay open longer. RAIN DANCE gives the same multipliers for 15 s, and SUNNY DAY does the reverse for 15 s, also letting SOLAR BEAM fire without charging. HAIL hurts every non-ICE POKéMON for 1/16 of its max HP every 3 s for 15 s. SANDSTORM does the same to every POKéMON that isn't ROCK, GROUND or STEEL type, also for 15 s; a new weather replaces the old."},{"section":"Field","term":"Screens and side effects","text":"REFLECT halves physical damage and LIGHT SCREEN special damage to one side for 12 s (critical hits ignore them, and BRICK BREAK shatters both). SAFEGUARD keeps statuses, confusion and seeds off a side for 12 s, and MIST (or GUARD SPEC.) blocks foes' stat drops for 12 s. SPIKES (up to 3 layers) hurt non-FLYING POKéMON sent out on that side for the rest of the battle. MUD SPORT and WATER SPORT halve ELECTRIC and FIRE damage on both sides for 12 s."},{"section":"Field","term":"Puddles and fire","text":"FIRE attacks scorch the ground where they land in outdoor arenas: the patch burns for 6.5 s (3.5 s in rain), up to four at once, and hurts any non-FIRE POKéMON standing in it for 1/16 of its max HP a second. WATER attacks leave puddles (9 s, 18 s in rain) and douse fires into steam. An ELECTRIC hit on a POKéMON standing in a puddle does 1.5× damage."},{"section":"Field","term":"Tall grass and ambushes","text":"In outdoor arenas a quick POKéMON (faster than its foe) or an evasive or erratic one may slip into a patch of tall grass and hide for 1.3–2.3 s. Attacks on it have only 60% of their accuracy. It springs out with an ambush: +1 critical stage and an attack that can't be dodged. FLY and DIG strike the same way after vanishing; a hit or leaving the grass reveals the hider."},{"section":"Field","term":"Walls, boulders and rocks","text":"A POKéMON launched hard into the arena's edge bounces off and is left open for 0.9 s. Against rock (gym walls, boulders, rocks) the slam also costs it 1/16 of its max HP. ROCK TOMB and STONE EDGE leave two rocks for 9 s that block bodies and projectiles, and evasive POKéMON take cover behind them from ranged attackers. A falling-rock hazard that misses leaves its rock as cover for 7 s."},{"section":"Field","term":"Species traits","text":"A few species fight in their own way. Fliers (PIDGEY, PIDGEOTTO, PIDGEOT, SPEAROW, FEAROW, BUTTERFREE) take to the air for 2.6–4.2 s, where contact moves and ground blasts can't reach them, until a heavy hit knocks them down. Heavy POKéMON (GEODUDE, ONIX) shrug off light hits ('UNFAZED'), are slow and dodge less. Cocoons (METAPOD, KAKUNA) barely move. CATERPIE keeps its distance and curls up against contact (×0.75 damage), and PIKACHU's cheeks spark before its ELECTRIC moves. ROLE PLAY and SKILL SWAP copy and trade these traits."},{"section":"Field","term":"Arena hazards","text":"Themed arenas fight for the home side: every few seconds a hazard is telegraphed (a shadow, a glow, a hiss), aimed at where your POKéMON is heading, then strikes everyone in its area except POKéMON of the arena's own types. Damage is a share of max HP: ×0.75 on NORMAL, ×1 on HARD, ×1.15 on EXTREME, and hazards come faster on harder difficulties and against bosses. Fighters step out once they notice: yours after 0.5 s, the home side sooner on HARD and EXTREME. On NORMAL hazards only appear in GYM LEADER and GIOVANNI battles; on HARD and EXTREME, in every trainer battle in those arenas."},{"section":"Field","term":"Hazards in the Kanto gyms","text":"PEWTER GYM and caves: falling rocks (11%, stagger, a miss leaves cover; ROCK, GROUND, STEEL safe). CERULEAN: riptides that sweep across the pool (7%; WATER types ride them). VERMILION: live floor panels (9%, 30% paralysis; ELECTRIC, GROUND and anything airborne safe). CELADON: drifting STUN SPORE, POISON POWDER or SLEEP POWDER clouds (GRASS safe). FUCHSIA and the KARATE MASTER's dojo: poison vents (6%, 45% poison, TOXIC on EXTREME; POISON, STEEL safe). SAFFRON: psychic rifts (8%, 35% confusion, warps you across the room; PSYCHIC, DARK safe). CINNABAR: lava geysers (10%, 30% burn, burning ground for 3.2 s; FIRE safe)."},{"section":"Field","term":"Other hazards","text":"VIRIDIAN FOREST: sticky webs that slow a POKéMON and stop it dodging (BUG safe). POKéMON TOWER and AGATHA: will-o'-wisps that chase your POKéMON (8%, 40% confusion; GHOST, NORMAL safe). ROCKET HIDEOUT and SILPH CO.: security lasers (9%; hop over them; they never hit TEAM ROCKET's POKéMON). POKéMON MANSION: falling debris; SEAFOAM and LORELEI: icicles (ICE, WATER safe). VIRIDIAN GYM: tremors (10%; GROUND, FLYING and airborne safe), BRUNO: falling rocks, LANCE: twisters that throw POKéMON (9%; DRAGON, FLYING safe). The CHAMPION and PROF. OAK fight on a clean floor."},{"section":"Field","term":"HMs in the field","text":"HMs work by themselves from the BAG once you have the right badge; no POKéMON needs to know the move. CUT (CASCADEBADGE) clears small trees. FLY (THUNDERBADGE) goes to any town you've visited, though not from indoors, caves or the SAFARI ZONE. SURF (SOULBADGE) crosses water, and STRENGTH (RAINBOWBADGE) lets you push boulders for as long as you stay on that map. FLASH (BOULDERBADGE) lights a dark cave like ROCK TUNNEL until you leave. ROCK SMASH (HM06, from CERULEAN CAVE's guard) breaks cracked boulders until the game is next loaded. Each HM also teaches its move."},{"section":"Items","term":"Held items","text":"Every POKéMON can hold one item: GIVE and TAKE from the POKéMON menu (ITEM) or the BAG. Berries are eaten once and are then gone; the others work for as long as they're held. EXTREME trainers' POKéMON hold items too, with no two the same on a team and at most two CHOICE items. In battle THIEF and COVET take a held item, KNOCK OFF knocks one away and TRICK swaps two; whatever a foe takes from your POKéMON is given back when the battle ends."},{"section":"Items","term":"Held berries","text":"ORAN BERRY (10 HP), BERRY JUICE (20 HP) and SITRUS BERRY (30 HP) are eaten the moment the holder drops to half HP or less. CHERI (paralysis), CHESTO (sleep), PECHA (poison, bad poison too), RAWST (burn), ASPEAR (freeze) and PERSIM (confusion) are eaten to cure their own problem; a LUM BERRY cures any status or confusion. A LEPPA BERRY recharges every move at once when the last one starts cooling down. NANAB, PINAP and WEPEAR are just carried."},{"section":"Items","term":"Battle boosters","text":"LEFTOVERS restore 1/16 of max HP every 3.5 s of battle. The 17 type boosters (CHARCOAL, MYSTIC WATER, MIRACLE SEED, MAGNET, NEVERMELTICE, BLACK BELT, POISON BARB, SOFT SAND, SHARP BEAK, TWISTEDSPOON, SILVERPOWDER, HARD STONE, SPELL TAG, DRAGON FANG, BLACKGLASSES, METAL COAT, SILK SCARF) make moves of their type 10% stronger. CHOICE BAND, CHOICE SPECS and CHOICE SCARF give ATTACK, SP. ATK or SPEED ×1.5, but the holder can't dodge (it isn't locked into one move). A QUICK CLAW cuts the wait before the holder's next move to 35% one time in five."},{"section":"Items","term":"Other held items","text":"A MACHO BRACE gives the holder 50% more EXP. but halves its SPEED. A SOOTHE BELL makes its bond grow twice as fast. A CLEANSE TAG on the lead POKéMON keeps a third of wild encounters away. A SMOKE BALL gets the holder out of any wild battle."},{"section":"Items","term":"Items in battle","text":"On NORMAL you can use items in battle from the BAG: medicine and revives, ETHERs and ELIXIRs (recharge moves, and the dodge too for ELIXIRs), X ATTACK, X DEFEND, X SPEED, X SPECIAL and X ACCURACY (+1 stage), DIRE HIT (+2 critical stages), GUARD SPEC. (MIST for 12 s), the POKé FLUTE (wakes every sleeper), the POKé DOLL (escape a wild battle) and status berries. BALLs only come out once a wild POKéMON is beaten. On HARD and EXTREME no items can be used in battle at all."},{"section":"Items","term":"Medicine","text":"POTION 20 HP, SUPER POTION 50, HYPER POTION 200, MAX POTION full; FRESH WATER 50, SODA POP 60, LEMONADE 80. FULL RESTORE heals all HP and status, REVIVE brings a fainted POKéMON back at half HP and MAX REVIVE at full. ANTIDOTE, PARLYZ HEAL, BURN HEAL, AWAKENING and ICE HEAL cure one status, and FULL HEAL cures any."},{"section":"Items","term":"PP UP and PP MAX","text":"With no PP to raise, these power up a POKéMON's signature move for good. Each step makes the signature's whole cast play 10% faster and every SPIRIT gain 10% bigger, up to 3 steps (30%). A PP UP is one step and a PP MAX (¥24,000, CELADON DEPT. STORE 5F) all three; the steps stay through evolution. Move cooldowns aren't affected."},{"section":"Items","term":"Evolution items","text":"FIRE, WATER, THUNDER, LEAF and MOON STONES evolve the species that need them when used from the BAG. The LINKING CORD stands in for trading: it evolves KADABRA, MACHOKE, GRAVELER and HAUNTER. The EVERSTONE is a key item: use it on a POKéMON to stop it evolving, and again to let it evolve."},{"section":"Items","term":"Key items that work from the BAG","text":"While the EXP. SHARE is in the BAG, POKéMON that sat out a battle get half of a full EXP. share. The AMULET COIN doubles trainers' prize money. REPEL, SUPER REPEL and MAX REPEL keep wild POKéMON below your lead's level away for 100, 200 and 250 steps."},{"section":"Progress","term":"EXP.","text":"EXP. follows Gen 3: the foe's base yield × its level / 7, ×1.5 for a trainer's POKéMON, split evenly among your POKéMON that were out while that foe was (fainted ones get none). A MACHO BRACE adds 50%. EXP. a POKéMON can't take because of the level cap is shared out among teammates still below it. POKéMON level up and evolve the moment they have enough, even mid-battle."},{"section":"Progress","term":"EXP. CANDIES and RARE CANDY","text":"EXP. CANDY S, M, L and XL give 200, 600, 2,000 and 6,000 EXP. and a RARE CANDY gives one level, but none of them can push a POKéMON past the level cap. LEVEL UP in the POKéMON menu feeds candies, smallest first, until the cap. Trainers hand out candies on every difficulty, wild wins sometimes drop one, and the marts sell them (S ¥250, M ¥700, L ¥2,000, XL ¥6,000)."},{"section":"Progress","term":"ENDLESS CANDY","text":"Every EXTREME game starts with the ENDLESS CANDY, a RARE CANDY that's never used up: one level per use, as often as you like, up to the level cap. With it in the BAG, LEVEL UP takes a POKéMON straight to the cap without spending any other candy."},{"section":"Progress","term":"Level cap","text":"Your POKéMON can't level past 2 below the strongest POKéMON of your next big battle; the summary shows the current cap. The caps are Lv 5 before the first rival battle, then 12 (BROCK), 19 (MISTY), 22 (LT. SURGE), 27 (ERIKA, GIOVANNI and the TOWER rival), 41 (KOGA), 41 (SABRINA), 45 (BLAINE), 48 (GIOVANNI), 51 (rival on ROUTE 22), 52, 54, 56 and 58 (the ELITE FOUR), 61 (the CHAMPION) and 68 (PROF. OAK's secret battle). After that last one, the cap lifts to Lv 100."},{"section":"Progress","term":"Leaders above the cap","text":"A GYM LEADER's whole team, like the ELITE FOUR's, the CHAMPION's and PROF. OAK's, stands at its ace's level, 2 above your cap. On NORMAL any of their POKéMON below that is raised to it with the same moves; on HARD and EXTREME every trainer's team starts at the cap and a leader's at cap + 2. So these fights are always a little uphill."},{"section":"Progress","term":"Evolution","text":"A POKéMON evolves as soon as it reaches its level, right in the middle of a battle if need be, keeping its HP, status and stat stages. Anyone who reached the level without evolving does so at the end of the battle, or through EVOLVE in the POKéMON menu. Stone and LINKING CORD evolutions are used from the BAG, and the EVERSTONE switches evolving off or back on."},{"section":"Progress","term":"Boss POKéMON","text":"FRLG's one-off encounters (the SNORLAX, the POWER PLANT's ELECTRODE, ZAPDOS, ARTICUNO, MOLTRES, the TOWER's ghost MAROWAK, MEWTWO) are bosses: five allies of their kind fight first, one after another, and then the boss itself comes out. On NORMAL the allies are 2 levels under the boss. On HARD and EXTREME the boss is at least 2 above your cap, the allies are at the cap or 2 under the boss, and EXTREME gives all six full competitive sets. Beaten, the boss gets up and joins you of its own accord, with no BALL needed (the ghost MAROWAK is laid to rest instead)."},{"section":"Progress","term":"NURSE JOY's CHANSEY","text":"Every POKéMON CENTER's CHANSEY can be rented: ¥500 for 5 heals, ¥1,000 for 10 or ¥1,500 for 15. It follows you, and talking to it (or calling it over with SPACE or the CALL button) uses SOFTBOILED to fully heal your whole team, fainted POKéMON included. You can only have one at a time; it heads home when its heals run out."},{"section":"Progress","term":"The PC","text":"The POKéMON Storage System keeps BOXES of 30 (a 6 × 5 grid with its own wallpaper), at least 12 of them, adding more as they fill. WITHDRAW and DEPOSIT share one screen with the party; you can't deposit your last POKéMON or withdraw into a full party of 6. Anything you catch with a full party, bosses included, goes straight to the PC."},{"section":"Difficulty","term":"NORMAL","text":"The journey as FRLG laid it out: trainers keep their own teams and moves, except that a GYM LEADER's whole team stands 2 levels above your cap. Arena hazards only appear in GYM LEADER and GIOVANNI battles, and at 75% strength. You can use items in battle, and so can the bosses (GYM LEADERS, GIOVANNI, rivals): one SUPER POTION before the second badge, two before the fourth, then two HYPER POTIONS, used at 1/4 HP."},{"section":"Difficulty","term":"HARD","text":"Every trainer's POKéMON is at least at your level cap (after the cap lifts, Lv 68), a GYM LEADER's whole team 2 above it. They're as evolved as their level allows (stone evolutions from Lv 20, trade ones from Lv 34) and use their latest level-up moves. Hazards appear in every trainer battle in a themed arena, nobody can use items in battle, and trainers fight sharper (see Sharper trainers)."},{"section":"Difficulty","term":"EXTREME","text":"Everything in HARD, plus six POKéMON for every trainer except the rival's first battle in OAK's LAB, picked to suit the trainer. Each has the best moveset it could have by then (level-up, tutor moves, and the TMs and HMs your badges allow), a nature to match, perfect IVs and a held item. Their POKéMON pick their best move almost every time, dodge 30% more eagerly, recharge their dodge faster and pause less. Every trainer reads your dodges and feints, hazards are faster and hit harder (×1.15, with TOXIC vents), and you start with the ENDLESS CANDY."},{"section":"Difficulty","term":"Sharper trainers","text":"On HARD and EXTREME, trainers send in whichever POKéMON matches up best against yours, with the ace still last. They switch out a POKéMON in a bad matchup whenever their 20 s switch cooldown allows (not right after it came in, nor when it's set up, asleep, bound or low on HP), and they re-pick a called move when you switch. In double battles both foes gang up on one target, and they go for a finishing priority attack or set up while your POKéMON sleeps."},{"section":"Battle basics","term":"Trapped","text":"MEAN LOOK and BLOCK pin the target in: it can't be switched out, you can't RUN while it's yours, and a wild one can't flee, for as long as the POKéMON that used the move stays in. A held SMOKE BALL still escapes. BIND, WRAP and the like trap for a few seconds the same way."},{"section":"Battle basics","term":"Type changes","text":"CAMOUFLAGE (the arena's ground), CONVERSION (one of its own moves' types) and CONVERSION 2 (a type that resists the foe's last move) change a POKéMON's type in battle. The new type counts for STAB, matchups and weather, and lasts until it's switched out or the battle ends."}]}};

function effects(m){

  if(m.sp&&X.sp&&X.sp[m.sp])o.push(X.sp[m.sp]);

  if(m.ail&&!(m.sp&&X.sp&&X.sp[m.sp])){const v=AIL[m.ail]||m.ail.toLowerCase();o.push(m.p&&m.ac<100?`${m.ac}% chance to ${v} the target.`:`${AILS[m.ail]||cap(v)} the target${m.ac&&m.ac<100?` (${m.ac}% chance)`:''}.`);}
  if(m.st){   // (one sentence for the stats a move changes together: ANCIENT POWER raises five at once)
    const who=m.sw==='self'?'the user\'s':'the target\'s',chance=m.sc!=null&&m.sc<100,groups={};
    for(const [k,dv] of m.st)(groups[dv]=groups[dv]||[]).push(STAT[k]||k);
    for(const dv in groups){const n=Math.abs(+dv),L=groups[dv],list=L.length>1?L.slice(0,-1).join(', ')+' and '+L[L.length-1]:L[0];
      o.push(`${chance?m.sc+'% chance to '+(+dv>0?'raise':'lower'):(+dv>0?'Raises':'Lowers')} ${who} ${list} by ${n} stage${n>1?'s':''}.`);}}
  // (priority doesn't change who goes first in real time: see the glossary)
  if(m.pri>0)o.push(`Priority +${m.pri}: on HARD and EXTREME, trainers favour it to finish off a weakened foe.`);
  if(m.hit)o.push(m.hit[0]===m.hit[1]?`Hits ${m.hit[0]} times.`:`Hits ${m.hit[0]}–${m.hit[1]} times.`);
  if(m.dr>0)o.push(`Restores ${m.dr}% of the damage dealt to the user.`);
  if(m.dr<0)o.push(`The user takes ${-m.dr}% of the damage dealt as recoil.`);
  if(m.hl)o.push(`Restores ${m.hl}% of the user's max HP.`);
  if(m.fl)o.push(`${m.fl}% chance to make the target flinch.`);
  if(m.cr)o.push('High critical-hit ratio.');
  if(m.crash)o.push('If it misses (dodged or blocked too), the user crashes: half the damage it would have dealt, at most half its max HP.');
  if(!o.length)o.push(m.cat==='X'?'No further effect.':'Deals damage with no further effect.');
  return o;
}

  const st=h('div',{class:'status'}),box=h('div',{class:'list'});main.append(st,box);
  const H=(k,t,cls)=>h('div',{class:'c '+(cls||'')},h('button',{class:(IS.sort===k?'on':'')+(IS.sort===k&&IS.desc?' desc':''),onclick:()=>{if(IS.sort===k)IS.desc=!IS.desc;else{IS.sort=k;IS.desc=k==='price';}list();}},t));
  function list(){
    const q=IS.q.trim().toLowerCase();
    const L=D.items.filter(i=>(!q||q.split(/\s+/).every(w=>i.hay.includes(w)))&&(!IS.cat||i.cat===IS.cat));
    const dir=IS.desc?-1:1;L.sort((a,b)=>(IS.sort==='cat'?catRank(a.cat)-catRank(b.cat):IS.sort==='price'?a.price-b.price:a.n.localeCompare(b.n))*dir||a.n.localeCompare(b.n));
    box.innerHTML='';st.innerHTML='';st.append(h('span',null,`${L.length} of ${D.items.length} items`),(IS.q||IS.cat)?h('a',{onclick:()=>{IS.q='';IS.cat='';draw();}},'Clear filters'):'');
    box.append(h('div',{class:'row head it'},H('n','Item'),H('cat','Category','icat'),H('price','Price','num'),h('div',{class:'c desc-c'},'What it does')));
    if(!L.length){box.append(h('div',{class:'empty'},'No items match.'));return;}
    for(const i of L){
      const open=IS.open===i.id;
      const r=h('div',{class:'row it'+(open?' open':''),onclick:e=>{if(e.target.closest('.detail'))return;IS.open=open?null:i.id;list();}},
        h('div',{class:'c name'},i.icon?h('img',{src:i.icon,alt:''}):h('span',{style:'width:24px'}),h('span',null,i.n)),h('div',{class:'c icat'},h('span',{class:'tag'},i.cat==='TMs'?'TMs & HMs':cap(i.cat.toLowerCase()))),
        h('div',{class:'c num'},i.key?'—':i.price?'¥'+i.price.toLocaleString():'—'),h('div',{class:'c desc desc-c'},i.d));
      if(open){const d=h('div',{class:'detail'},h('div',null,i.d),h('div',{class:'kv'},
          h('span',null,'Buy: ',h('b',null,i.key||!i.sold.length?'not sold':'¥'+i.price.toLocaleString())),h('span',null,'Sells for: ',h('b',null,i.key||!i.price?'can\'t be sold':'¥'+Math.floor(i.price/2).toLocaleString())),
          i.held?h('span',null,'Can be held: ',h('b',null,'yes')):''));
        if(i.tm){const mv=D.moves.find(m=>m.id===i.tm);if(mv)d.append(h('div',null,h('h4',null,'Teaches'),h('span',{class:'tag'},mv.n),' ',tyChip(mv.t),' ',catChip(mv.cat)));}
        if(i.sold.length)d.append(h('div',null,h('h4',null,'Sold at'),i.sold.map(s=>h('span',{class:'tag'},s))));
        if(i.found.length)d.append(h('div',null,h('h4',null,`Found (${i.found.length})`),h('div',{class:'mons'},i.found.map(s=>h('span',{class:'tag'},s)))));
        r.append(d);}
      box.append(r);
    }
  }
  list();
}

/* ---------- glossary ---------- */
const GS={q:''};
function drawGlossary(main){
  main.append(h('div',{class:'tools'},searchBox(GS.q,v=>{GS.q=v;list();})));
  const holder=h('div');main.append(holder);
  const SEC=['Battle basics','Statuses','Stats','Moves','Items','Field','Progress','Difficulty'];
  function list(){
    holder.innerHTML='';const q=GS.q.trim().toLowerCase();
    const G=(X.glossary||[]).filter(g=>!q||(g.term+' '+g.text+' '+g.section).toLowerCase().includes(q));
    const secs=[...new Set(G.map(g=>g.section))].sort((a,b)=>(SEC.indexOf(a)<0?99:SEC.indexOf(a))-(SEC.indexOf(b)<0?99:SEC.indexOf(b)));
    if(!G.length){holder.append(h('div',{class:'empty'},'Nothing matches.'));return;}
    for(const s of secs){holder.append(h('div',{class:'gsec'},s),h('div',{class:'gl'},G.filter(g=>g.section===s).map(g=>h('div',{class:'card'},h('h3',null,g.term),h('p',null,g.text)))));}
    {const A=Object.keys(ANIM).map(k=>({term:ANIM[k][0],text:ANIM[k][1]+' ('+D.moves.filter(m=>m.anim===k).length+' moves)'})).concat(Object.keys(TIMING).map(k=>({term:'Timing: '+(TMARK[k]?TMARK[k]+' ':'')+TIMING[k][0],text:TIMING[k][1]})))
      .filter(g=>!q||(g.term+' '+g.text).toLowerCase().includes(q));
     if(A.length)holder.append(h('div',{class:'gsec'},'Move animations'),h('div',{class:'gl'},A.map(g=>h('div',{class:'card'},h('h3',null,g.term),h('p',null,g.text)))));}
    if(!q&&X.fields&&Object.keys(X.fields).length){holder.append(h('div',{class:'gsec'},'Reading a move'),h('div',{class:'gl'},Object.entries(X.fields).map(([k,v])=>h('div',{class:'card'},h('h3',null,FIELD_NAMES[k]||k),h('p',null,v)))));}
  }
  list();
}
const FIELD_NAMES={p:'Power',a:'Accuracy',c:'Category',ail:'Status effect',ac:'Status chance',st:'Stat changes',sc:'Stat-change chance',sw:'Who the stat change hits',pri:'Priority',hit:'Multi-hit',dr:'Drain and recoil',hl:'Healing',fl:'Flinch',cr:'Critical-hit ratio',crash:'Crash',ct:'Contact',so:'Sound',tg:'Targets',sig:'Signature move',cooldown:'Cooldown',moveCool:'Cooldown',pp:'PP',ppup:'PP UP and PP MAX'};

function draw(){const main=$('#main');main.innerHTML='';({moves:drawMoves,items:drawItems,glossary:drawGlossary})[tab](main);}
/* theme */
const root=document.documentElement;const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const tb=$('#theme');const paint=()=>{tb.textContent=dark()?'Light':'Dark';};
tb.addEventListener('click',()=>{root.dataset.theme=dark()?'light':'dark';try{localStorage.setItem('ptpRefTheme',root.dataset.theme);}catch(e){}paint();});
try{const t=localStorage.getItem('ptpRefTheme');if(t)root.dataset.theme=t;}catch(e){}
paint();
$('#sub').textContent=`Moves, items and how the game plays · from the game's own data (${new Date(D.built).toLocaleDateString()})`;
$('#foot').textContent='Pallet to Pewter · a fan game. Numbers are read straight from the game: cooldowns are in seconds of real-time battle.';
drawTabs();draw();
</script>
